<!DOCTYPE html>
<html>
<head>
<title>Arnu Loves You</title>

<!-- Cute & Readable Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffb6c1, #ffc0cb, #ffd1dc);
    overflow: hidden;
    text-align: center;
    color: white;
}

/* Title */
h1 {
    margin-top: 20px;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 1px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 8px #fff; }
    to { text-shadow: 0 0 20px #ff1493; }
}

/* Slide Container */
.slide-container {
    position: relative;
    width: 85%;
    height: 420px;
    margin: 20px auto;
}

/* Slides */
.slide {
    position: absolute;
    width: 100%;
    opacity: 0;
    transform: scale(0.9);
    transition: all 0.6s ease;
    padding: 20px;
    line-height: 1.8;
    font-size: 18px;
}

.active {
    opacity: 1;
    transform: scale(1);
}

/* Teddy */
.teddy {
    font-size: 45px;
    margin-bottom: 10px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%,100%{transform: translateY(0);}
    50%{transform: translateY(-10px);}
}

/* Buttons */
button {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    padding: 12px 25px;
    font-size: 16px;
    margin: 10px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    background: #ff69b4;
    color: white;
    box-shadow: 0 0 15px #ff1493;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
    background: #ff1493;
}

/* Indicator */
#indicator {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 20px;
    background: #ff69b4;
    box-shadow: 0 0 15px white;
    margin-top: 10px;
    font-weight: 600;
}

/* Floating hearts */
.heart {
    position: absolute;
    bottom: -50px;
    font-size: 24px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-900px) rotate(360deg); opacity: 0; }
}

/* Popup */
.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: white;
    color: #ff1493;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 30px pink;
    transition: 0.5s;
    z-index: 1000;
}

.popup.show {
    transform: translate(-50%, -50%) scale(1);
}
</style>
</head>

<body>

<h1>💖 Arnu loves you 💖</h1>
<div id="indicator">Slide 1 / 20</div>

<div class="slide-container" id="slides"></div>

<button onclick="prevSlide()">⬅ Previous</button>
<button onclick="nextSlide()">Next ➡</button>

<!-- Surprise Popup -->
<div id="popup" class="popup">
<h2>🎉 Happy 15 Months Anniversary 🎉</h2>
<p>You are the most beautiful part of my life. Thank you for loving me and making every day magical. I promise to cherish you forever. 💖</p>
<button onclick="closePopup()">Close 💕</button>
</div>

<script>
const messages = [
"Before you came into my life, everything felt ordinary and incomplete. When you arrived, my world became brighter and warmer. You gave meaning to my mornings and peace to my nights. Loving you has changed the way I see life, and every single day feels special because you are in it.",
"You filled my quiet days with laughter and happiness. A simple message from you can change my entire mood. Your presence in my life feels like a blessing I never knew I needed. You made me realize what true companionship feels like.",
"You brought colors into my world that I didn’t know were missing. My heart feels lighter and happier because of you. Even ordinary days feel extraordinary when I share them with you.",
"You redefined love for me. You showed me that love is trust, comfort, and endless support. Because of you, I now understand what it truly means to feel safe with someone.",
"You are my safe place and my biggest happiness. Being with you feels like home. Your love has brought peace into my life.",
"You inspire me to be better and dream bigger every day. Your belief in me gives me strength.",
"You make even ordinary moments magical just by being there. Your presence turns simple days into cherished memories.",
"You accept me with all my flaws and imperfections, and that means everything. Your love makes me feel complete.",
"My future feels brighter because you are part of it. Every dream I have includes you.",
"You have given my life peace and excitement at the same time. Loving you feels effortless and natural.",
"You are my best friend and my forever favorite person. Life feels beautiful with you.",
"You make my heart smile in ways I can’t explain. Just thinking of you brings joy.",
"You healed parts of me I didn’t know were hurting. Your love is gentle and powerful.",
"You gave me confidence and strength through your love. I am better because of you.",
"You are the reason behind my happiest memories. I cherish every second with you.",
"Every heartbeat reminds me how lucky I am to have you in my life.",
"You turned my ordinary story into a beautiful love story filled with warmth.",
"With you, I believe in forever. I believe in building something lasting and strong.",
"My life feels complete because you are in it. You are my greatest blessing.",
"🎉 Happy 15 Months Anniversary, my love! 🎉 These fifteen months have been magical. Thank you for loving me, supporting me, and being my everything. I promise to cherish you forever and always."
];

const slideContainer = document.getElementById("slides");

messages.forEach((msg, index) => {
let slide = document.createElement("div");
slide.className = "slide" + (index === 0 ? " active" : "");
slide.innerHTML = "<div class='teddy'>🧸💖🧸</div>" + msg;
slideContainer.appendChild(slide);
});

let currentSlide = 0;
let slides = document.querySelectorAll(".slide");
let indicator = document.getElementById("indicator");
let popup = document.getElementById("popup");

function showSlide(index) {
slides.forEach(slide => slide.classList.remove("active"));
slides[index].classList.add("active");
indicator.innerText = "Slide " + (index + 1) + " / " + slides.length;

if(index === slides.length - 1){
setTimeout(()=> popup.classList.add("show"), 800);
}
}

function nextSlide() {
currentSlide = (currentSlide + 1) % slides.length;
showSlide(currentSlide);
}

function prevSlide() {
currentSlide = (currentSlide - 1 + slides.length) % slides.length;
showSlide(currentSlide);
}

function closePopup(){
popup.classList.remove("show");
}

/* Floating hearts */
for (let i = 0; i < 30; i++) {
let heart = document.createElement("div");
heart.className = "heart";
heart.innerHTML = "❤";
heart.style.left = Math.random() * 100 + "vw";
heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
heart.style.fontSize = (Math.random() * 20 + 10) + "px";
document.body.appendChild(heart);
}
</script>

</body>
</html>
