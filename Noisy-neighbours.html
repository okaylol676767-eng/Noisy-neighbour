<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Noisy Neighbours</title>
</head>
<body style="background:#111;color:white;font-family:Arial;padding:20px;max-width:600px;margin:auto;">

<h1 style="color:#ff4da6;">Noisy Neighbours</h1>

<div id="game"></div>

<p>
🔥 Chemistry: <span id="chem">0</span><br>
🎭 Drama: <span id="dra">0</span><br>
🧠 Sanity: <span id="san">5</span><br>
🏢 HOA: <span id="hoa">0</span>
</p>

<script>
let chem=0, dra=0, san=5, hoa=0;

function update(){
document.getElementById("chem").innerText=chem;
document.getElementById("dra").innerText=dra;
document.getElementById("san").innerText=san;
document.getElementById("hoa").innerText=hoa;
}

function start(){
document.getElementById("game").innerHTML=
`<p>12:03AM. THUD. Loud music. Something crashes.</p>
<p>What do you do?</p>
<button onclick="storm()">Storm over</button>
<button onclick="ignore()">Ignore it</button>
<button onclick="loud()">Play louder music</button>`;
}

function storm(){
chem+=1; dra+=2;
document.getElementById("game").innerHTML=
`<p>Blaze opens the door. Shirt: questionable.</p>
<button onclick="chem+=2; end()">Blush</button>
<button onclick="dra+=2; end()">Argue</button>`;
update();
}

function ignore(){
san+=1;
end();
}

function loud(){
hoa+=2; dra+=1;
end();
}

function end(){
update();

if(chem>=4){
document.getElementById("game").innerHTML=
"<h2>Balcony Romance Ending</h2><button onclick='reset()'>Restart</button>";
}
else if(dra>=5){
document.getElementById("game").innerHTML=
"<h2>Hallway Drama Ending</h2><button onclick='reset()'>Restart</button>";
}
else if(hoa>=3){
document.getElementById("game").innerHTML=
"<h2>HOA Intervention Ending</h2><button onclick='reset()'>Restart</button>";
}
else{
document.getElementById("game").innerHTML=
"<p>The tension continues...</p><button onclick='start()'>Next Night</button>";
}
}

function reset(){
chem=0; dra=0; san=5; hoa=0;
update();
start();
}

start();
update();
</script>

</body>
</html>
